<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check your email | CampusLodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth">
  <div class="auth-card">

    <!-- Green side (hidden on phones) -->
    <div class="auth-art">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="CampusLodge logo">
        CampusLodge
      </a>
      <div>
        <h2>Almost <span class="orange-word">there.</span></h2>
        <p>One quick tap on the link in your email and you are in.</p>
      </div>
    </div>

    <!-- Form side -->
    <div class="auth-form-side">
      <div class="auth-box">
        <a href="index.html" class="logo auth-logo">
          <img src="images/logo.png" alt="CampusLodge logo">
          CampusLodge
        </a>

        <div class="auth-center">
          <div class="mail-icon">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#16803C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-10 6L2 7"/></svg>
          </div>
          <h1>Check your <span class="green-word">email</span></h1>
          <p class="muted">We sent a link to <strong>your email address</strong>. Open it to continue. If you do not see it, check your spam folder.</p>

          <a href="login.html" class="btn btn-green">Go to login</a>

          <p class="auth-switch">Did not get it? <a href="#">Resend the email</a></p>
          <p class="auth-switch">Wrong email? <a href="signup.html">Back to sign up</a></p>
        </div>
      </div>
    </div>

  </div>
  </div>

</body>
</html>
