<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New password | CampusLodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth">
  <div class="auth-card">

    <!-- Green side (hidden on phones) -->
    <div class="auth-art">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="CampusLodge logo">
        CampusLodge
      </a>
      <div>
        <h2>Almost <span class="orange-word">there.</span></h2>
        <p>Choose a new password for your account.</p>
      </div>
    </div>

    <!-- Form side -->
    <div class="auth-form-side">
      <div class="auth-box">
        <a href="index.html" class="logo auth-logo">
          <img src="images/logo.png" alt="CampusLodge logo">
          CampusLodge
        </a>

        <div id="reset-form-box">
          <h1>Choose a new <span class="green-word">password</span></h1>
          <p class="muted">Use at least 8 characters.</p>
          <form id="reset-form">
            <div class="field">
              <label for="new-password">New password</label>
              <input type="password" id="new-password">
            </div>
            <div class="field">
              <label for="confirm-password">Confirm new password</label>
              <input type="password" id="confirm-password">
            </div>
            <p class="error-text" id="reset-error" hidden></p>
            <button type="submit" class="btn btn-green">Save new password</button>
          </form>
        </div>
        <div id="reset-done" hidden>
          <h1>Password <span class="green-word">changed</span></h1>
          <p class="muted">You can now log in with your new password.</p>
          <a href="login.html" class="btn btn-green">Go to login</a>
        </div>
      </div>
    </div>

  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="reset.js"></script>

</body>
</html>
