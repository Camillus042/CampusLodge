<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | CampusLodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth">
  <div class="auth-card">

    <!-- Green side (hidden on phones) -->
    <div class="auth-art">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="CampusLodge logo">
        CampusLodge
      </a>
      <div>
        <h2>It happens to <span class="orange-word">everyone.</span></h2>
        <p>Tell us your email and we will send you a link to choose a new password.</p>
      </div>
    </div>

    <!-- Form side -->
    <div class="auth-form-side">
      <div class="auth-box">
        <a href="index.html" class="logo auth-logo">
          <img src="images/logo.png" alt="CampusLodge logo">
          CampusLodge
        </a>

        <a href="login.html" class="back-link">&larr; Back to login</a>
        <h1>Forgot your <span class="green-word">password?</span></h1>
        <p class="muted">Enter the email you signed up with.</p>

        <form>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
          </div>
          <button type="submit" class="btn btn-green">Send reset link</button>
        </form>
      </div>
    </div>

  </div>
  </div>

</body>
</html>
